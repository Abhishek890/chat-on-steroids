name: Publish release

# Run this workflow from the branch/commit you want to release.
#
# Example:
#   gh workflow run publish.yml --ref main
#
# The workflow builds a fresh candidate from that ref and publishes the
# version declared by package.json.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Determine release version
        id: version
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="v$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "Release version: $version"
          echo "Release tag: $tag"
          echo "Build ref: $GITHUB_REF"
          echo "Build commit: $GITHUB_SHA"

      - name: Verify release metadata agrees
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const manifest = require('./extension/manifest.json');

          const versionSource = fs.readFileSync(
            'src/main/version.ts',
            'utf8'
          );

          const appVersion =
            versionSource.match(/APP_VERSION = '([^']+)'/)?.[1];

          const versions = [
            pkg.version,
            lock.version,
            lock.packages?.['']?.version,
            manifest.version,
            appVersion
          ];

          if (versions.some((version) => version !== pkg.version)) {
            throw new Error(
              `Release versions disagree: ${versions.join(', ')}`
            );
          }

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');

          const changelogVersion =
            changelog.match(/^## \[(\d+\.\d+\.\d+)\]/m)?.[1];

          if (changelogVersion !== pkg.version) {
            throw new Error(
              `Top changelog entry ${changelogVersion ?? '<missing>'} does not match ${pkg.version}`
            );
          }

          const notesPath =
            `docs/release-notes/v${pkg.version}.md`;

          if (!fs.existsSync(notesPath)) {
            throw new Error(`Missing ${notesPath}`);
          }

          const notes = fs.readFileSync(notesPath, 'utf8');

          if (!notes.includes(`## ${pkg.version}`)) {
            throw new Error(
              `${notesPath} has no matching version heading`
            );
          }

          if (!/unsigned/i.test(notes) ||
              !/unnotarized/i.test(notes)) {
            throw new Error(
              `${notesPath} must disclose unsigned and unnotarized macOS artifacts`
            );
          }

          for (const artifact of [
            'Chat-On-Steroids-Setup-x64.exe',
            'Chat-On-Steroids-Setup-arm64.exe',
            'Chat-On-Steroids-macOS-x64.dmg',
            'Chat-On-Steroids-macOS-x64.zip',
            'Chat-On-Steroids-macOS-arm64.dmg',
            'Chat-On-Steroids-macOS-arm64.zip',
            'Chat-On-Steroids-Linux-x64.AppImage',
            'Chat-On-Steroids-Linux-x64.deb',
            'Chat-On-Steroids-Linux-arm64.AppImage',
            'Chat-On-Steroids-Linux-arm64.deb',
            'Chat-On-Steroids-Extension.zip',
            'SHA256SUMS.txt'
          ]) {
            if (!notes.includes(`\`${artifact}\``)) {
              throw new Error(
                `${notesPath} is missing ${artifact}`
              );
            }
          }
          NODE

      # Keep this check: the build must use the expected/current tunnel payload.
      - name: Require current OpenAI tunnel-client
        run: npm run verify:tunnel-current

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      - name: Require reviewed release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          notes="docs/release-notes/$TAG.md"

          if [ ! -s "$notes" ]; then
            echo "Missing $notes — write the release notes before publishing." >&2
            exit 1
          fi

      - name: Refuse an existing release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/check-release-absent.mjs

  candidate:
    name: Build candidate
    needs: preflight
    uses: ./.github/workflows/release.yml

  publish:
    name: Publish
    needs:
      - preflight
      - candidate

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Show release information
        run: |
          echo "Source ref: $GITHUB_REF"
          echo "Source commit: $GITHUB_SHA"
          echo "Release version: $VERSION"
          echo "Release tag: $TAG"

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      - name: Require reviewed release notes
        run: |
          set -euo pipefail

          notes="docs/release-notes/$TAG.md"

          if [ ! -s "$notes" ]; then
            echo "Missing $notes — write the release notes before publishing." >&2
            exit 1
          fi

      - name: Download the fresh candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chat-on-steroids-candidate-${{ github.run_id }}
          path: publish

      # The checksums were generated during the fresh candidate build.
      # Re-check them before anything is published.
      - name: Re-verify the checksums
        working-directory: publish
        run: |
          set -euo pipefail

          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Final tunnel-client verification
        run: npm run verify:tunnel-current

      - name: Final release-absence check
        run: node scripts/check-release-absent.mjs

      - name: Publish the release
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            publish/Chat-On-Steroids-Setup-x64.exe \
            publish/Chat-On-Steroids-Setup-arm64.exe \
            publish/Chat-On-Steroids-macOS-x64.dmg \
            publish/Chat-On-Steroids-macOS-x64.zip \
            publish/Chat-On-Steroids-macOS-arm64.dmg \
            publish/Chat-On-Steroids-macOS-arm64.zip \
            publish/Chat-On-Steroids-Linux-x64.AppImage \
            publish/Chat-On-Steroids-Linux-x64.deb \
            publish/Chat-On-Steroids-Linux-arm64.AppImage \
            publish/Chat-On-Steroids-Linux-arm64.deb \
            publish/Chat-On-Steroids-Extension.zip \
            publish/SHA256SUMS.txt \
            --title "$(sed -n 's/^## //p' "docs/release-notes/$TAG.md" | head -n 1)" \
            --notes-file "docs/release-notes/$TAG.md"

      - name: Show published release
        run: |
          gh release view "$TAG" --json url --jq .url
